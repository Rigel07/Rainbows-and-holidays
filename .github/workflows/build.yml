name: Compilar mod (.jar)

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar codigo
        uses: actions/checkout@v4

      - name: Descomprimir el zip
        run: |
          shopt -s nullglob
          zips=(*.zip)
          if [ ${#zips[@]} -eq 0 ]; then echo "No hay ningun .zip en la raiz del repositorio"; exit 1; fi
          mkdir -p _mod
          unzip -q -o "${zips[0]}" -d _mod
          gradle_file=$(find _mod -name build.gradle | head -n 1)
          echo "MOD_DIR=$(dirname "$gradle_file")" >> "$GITHUB_ENV"

      - name: Instalar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Instalar Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: 8.8

      - name: Compilar
        working-directory: ${{ env.MOD_DIR }}
        run: gradle build --no-daemon

      - name: Subir el .jar
        uses: actions/upload-artifact@v4
        with:
          name: TreasureRainbow-jar
          path: ${{ env.MOD_DIR }}/build/libs/*.jar
